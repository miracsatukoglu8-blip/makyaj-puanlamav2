<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makyaj Puanlayıcı V2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #ff477e; margin-bottom: 5px; font-size: 26px; }
        p { color: #6c757d; font-size: 14px; margin-bottom: 25px; }
        
        .error-box {
            background-color: #ffe3e3;
            color: #d63031;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #ffb3b3;
            font-weight: bold;
        }
        
        .file-label {
            display: inline-block;
            background: #ff7096;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .file-label:hover { background: #ff477e; }
        input[type="file"] { display: none; }
        
        #file-name { color: #4b5563; font-style: italic; margin-bottom: 20px; font-size: 13px; }
        
        .btn-submit {
            background: #4ade80;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #22c55e; }
        
        #loading { display: none; margin-top: 15px; font-weight: bold; color: #ff477e; }
    </style>
</head>
<body>

<div class="container">
    <h1>Makyaj Puanlayıcı V2 ✨</h1>
    <p>Fotoğrafını yükle, gelişmiş yapay zeka makyajını detaylıca analiz etsin!</p>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form action="/analyze" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
        <label for="file-upload" class="file-label">📸 Bir Fotoğraf Seç</label>
        <input id="file-upload" type="file" name="file" onchange="updateFileName()">
        <div id="file-name">Seçilen dosya: Henüz seçilmedi</div>
        
        <button type="submit" class="btn-submit">Makyajı Analiz Et 🚀</button>
    </form>

    <div id="loading">🔮 Analiz Ediliyor, Lütfen Bekleyin...</div>
</div>

<script>
    function updateFileName() {
        const input = document.getElementById('file-upload');
        const output = document.getElementById('file-name');
        if(input.files.length > 0) {
            output.innerText = "Seçilen dosya: " + input.files[0].name;
        }
    }
    function showLoading() {
        document.getElementById('loading').style.display = 'block';
    }
</script>

</body>
</html>
